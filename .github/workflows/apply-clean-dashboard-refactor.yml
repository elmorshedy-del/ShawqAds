name: Apply clean dashboard refactor

on:
  issue_comment:
    types: [created]
  push:
    branches:
      - clean/top-movers-creative-identity
    paths:
      - scripts/refactor-top-movers-and-creatives.mjs
      - .github/workflows/apply-clean-dashboard-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.event_name == 'push' || (github.event.issue.number == 90 && contains(github.event.comment.body, 'run-clean-refactor'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean/top-movers-creative-identity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply surgical refactor
        run: node scripts/refactor-top-movers-and-creatives.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression tests
        run: |
          npm run test:logical-creative
          npm run test:top-movers
          npm run test:campaign-attribution
          npm run test:reporting-data
          npm run test:render
      - name: Build
        run: npm run build
      - name: Remove one-shot refactor machinery
        run: |
          rm scripts/refactor-top-movers-and-creatives.mjs
          rm .github/workflows/apply-clean-dashboard-refactor.yml
      - name: Commit clean source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor settled top movers and logical creative identity"
          git push origin HEAD:clean/top-movers-creative-identity
